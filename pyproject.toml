[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=78", "wheel", "setuptools_scm>=7.1.0", "versionista>=1.1.0"]

[project]
authors = [
  {name = "NCI GDC", email = "gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com"}
]
classifiers = [
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9"
]
dependencies = [
  "addict",
  "datadog",
  "deepdiff", # required by compare_indices
  "dictdiffer",
  "elasticsearch",
  "more-itertools",
  "networkx",
  "progressbar2",
  "python-dotenv",
  "python-json-logger",
  "requests",
  "SQLAlchemy",
  "psqlgraph",
  "gdcdictionary",
  "gdcdatamodel2",
  "gdc-ng-models",
  "indexclient",
  "queueclient",
  "gdcmodels"
]
description = "Repository for building the GDC Elasticsearch indices."
dynamic = ["version"]
license-files = ["LICENSE"]
name = "esbuild"
readme = "README.md"
requires-python = "~=3.9.0"

[project.optional-dependencies]
dev = [
  "jmespath",
  "mock",
  "pytest",
  "pytest-cov",
  "gdcdatamodel2[visualization]",
  "testcontainers"
]

[project.scripts]
"compare_indices.py" = "esbuild.bin.compare_indices:main"
esbuild-cli = "esbuild.bin.esbuild_cli:main"
"master.py" = "esbuild.bin.master:main"
"minion.py" = "esbuild.bin.minion:main"

[project.urls]
Repository = "https://github.com/NCI-GDC/esbuild"

[tool.coverage.html]
directory = "docs/htmlcov"
title = "esbuild coverage report"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.setuptools_scm]
local_scheme = "versionista-local-format"
version_scheme = "versionista-format"
