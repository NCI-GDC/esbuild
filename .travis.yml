---
language: python
dist: focal

python:
  - '3.6'

sudo: true

env:
  - ES_HOST='localhost' ES_VERSION="7.7.1"

addons:
  postgresql: '13'
  apt:
    sources:
      - sourceline: deb http://apt.postgresql.org/pub/repos/apt/ focal-pgdg main 13
        key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    packages:
      - postgresql-13
      - postgresql-client-13

before_install:
  # There seems to already be nodes created in this directory on startup, which
  # is interfering with starting our installed es version.
  - sudo rm -rf /var/lib/elasticsearch

install:
  # Install and start elasticsearch
  - curl -O https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-${ES_VERSION}-amd64.deb
    && sudo dpkg --force-confnew -i elasticsearch-${ES_VERSION}-amd64.deb
  - sudo /usr/share/elasticsearch/bin/elasticsearch-plugin install mapper-size
  - sudo sed -i 's/^-Xms.*/-Xms2g/' /etc/elasticsearch/jvm.options
  - sudo sed -i 's/^-Xmx.*/-Xmx2g/' /etc/elasticsearch/jvm.options
  - sudo chown -R elasticsearch:elasticsearch /etc/default/elasticsearch
  - sudo chmod a+r /etc/default/elasticsearch
  - sudo chmod -R 755 /etc/elasticsearch
  - sudo chmod -R 777 /var/log/elasticsearch
  - sudo service elasticsearch start
  - /usr/share/elasticsearch/bin/elasticsearch -Vv

  # Make sure we have a new enough virtualenv to get a version of pip that
  # understands VCS URLs. Install virtualenv before running tox because
  # tox-travis seems to break if we let tox upgrade it for us.
  - pip install tox-travis 'virtualenv>=20.0.21' 'pip >= 20.1.1' 'pip-tools==6.3.0'

before_script:
  # Wait for elasticsearch to be up
  - printf 'Waiting for Elasticsearch '; until curl localhost:9200 2> /dev/null; do
    printf '.'; sleep 1; done; printf ' done'

script: tox

after_script:
  - curl -sL https://raw.githubusercontent.com/travis-ci/artifacts/master/install
    | bash
  - artifacts --quiet upload --bucket gdc-travis-artifacts --target-paths "$TRAVIS_REPO_SLUG/$TRAVIS_BUILD_NUMBER/$TRAVIS_JOB_NUMBER/"
    tests/htmlcov/
  - 'echo Artifact link: https://gdc-travis-artifacts.osdc.io/${TRAVIS_REPO_SLUG}/${TRAVIS_BUILD_NUMBER}/${TRAVIS_JOB_NUMBER}'
