language: python

python:
  - "3.5"
  - "3.6"

node: 6

sudo: true

env:
  - ES_HOST='localhost' ES_VERSION=5.6.14 NODE_VERSION=10 BOTO_CONFIG=/dev/null

addons:
  postgresql: '9.4'

before_install:
  # Upgrade npm
  - npm install -g npm@'>=6'

install:
  # Update nodejs
  - rm -rf ~/.nvm
  - git clone https://github.com/creationix/nvm.git ~/.nvm 
  - (cd ~/.nvm && git checkout `git describe --abbrev=0 --tags`)
  - source ~/.nvm/nvm.sh && nvm install $NODE_VERSION

  # Install and start elasticsearch
  - curl -O https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-${ES_VERSION}.deb
  - sudo dpkg -i --force-confnew elasticsearch-${ES_VERSION}.deb
  - sudo /usr/share/elasticsearch/bin/elasticsearch-plugin install mapper-size
  - sudo service elasticsearch start
  
  # Install elasticdump and other requirements
  - npm install -g elasticdump

  - pip install tox-travis

before_script:
  # Wait for elasticsearch to be up
  - printf 'Waiting for Elasticsearch '; until curl localhost:9200 2> /dev/null; do printf '.'; sleep 1; done; printf ' done'
  - psql -U postgres -c "create user test with superuser password 'test'"
  - psql -U postgres -c "create database automated_test with owner test"

script: "tox"

after_script:
  - curl -sL https://raw.githubusercontent.com/travis-ci/artifacts/master/install | bash
  - artifacts --quiet upload --bucket gdc-travis-artifacts --target-paths "$TRAVIS_REPO_SLUG/$TRAVIS_BUILD_NUMBER/$TRAVIS_JOB_NUMBER/" htmlcov/
  - "echo Artifact link: https://gdc-travis-artifacts.osdc.io/${TRAVIS_REPO_SLUG}/${TRAVIS_BUILD_NUMBER}/${TRAVIS_JOB_NUMBER}"
