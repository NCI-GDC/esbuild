---
include:
  - project: nci-gdc/gitlab-templates
    ref: master
    file:
      - templates/artifacts/python-docker-service.yaml

.services:
  allow_failure: true
  when: manual
  parallel:
    matrix:
      - DEPLOY_SERVICE_LIST: [esbuild]

variables:
  FF_NETWORK_PER_BUILD: 1
  BASE_CONTAINER_VERSION: 3.1.0
  LANGUAGE_VERSION: python3.13

tox:
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres
      variables:
        POSTGRES_PASS: test
        POSTGRES_HOST_AUTH_METHOD: trust
        PG_INIT_SQL: |
          create user test with superuser password 'test';
          create database automated_test with owner test;
          create database indexd_test with owner test;
    - name: docker.osdc.io/ncigdc/ci-elasticsearch-7:${BASE_CONTAINER_VERSION}
      alias: elasticsearch
    - name: docker.osdc.io/ncigdc/indexd:develop
      alias: indexd
      pull_policy: always
      variables:
        PG_INDEXD_HOST: postgres
        PG_INDEXD_USER: test
        PG_INDEXD_PASS: test
        PG_INDEXD_DBNAME: indexd_test
        INDEXD_USER: admin
        INDEXD_PASS: admin
  variables:
    PG_HOST: postgres
    ES_HOST: elasticsearch
    INDEXD_HOST: http://indexd
