---
services:
  elasticsearch:
    image: docker.osdc.io/ncigdc/ci-elasticsearch-7:3.2.2
    hostname: elasticsearch.service.local
    platform: linux/amd64
    ports:
      - '9200'
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9200/]
      interval: 5s
      timeout: 3s
  postgres:
    image: docker.osdc.io/ncigdc/ci-postgres-13:3.2.2
    hostname: postgres.service.local
    platform: linux/amd64
    environment:
      POSTGRES_PASS: test
      POSTGRES_HOST_AUTH_METHOD: trust
      PG_INIT_SQL: |
        create user test with superuser password 'test';
        create database automated_test with owner test;
        create database indexd_test with owner test;
    ports:
      - '5432'
    healthcheck:
      test: [CMD-SHELL, pg_isready]
      interval: 5s
      timeout: 5s
      retries: 5
  indexd:
    image: docker.osdc.io/ncigdc/indexd:develop
    hostname: indexd.service.local
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_INDEXD_HOST: postgres.service.local
      PG_INDEXD_USER: test
      PG_INDEXD_PASS: test
      PG_INDEXD_DBNAME: indexd_test
      INDEXD_USER: admin
      INDEXD_PASS: admin
      GUNICORN_WORKERS: 1
      GUNICORN_THREADS: 1
    ports:
      - '80'
    healthcheck:
      test: [CMD, curl, -f, http://localhost/_status]
      interval: 3s
      timeout: 10s
      retries: 3
