[tox]
envlist = py{35,36}

[testenv]
changedir = tests
passenv = *
setenv =
  PG_HOST=localhost
  PG_USER=test
  PG_PASS=test
  PG_NAME=automated_test
deps =
  -rrequirements.txt
  -rdev-requirements.txt
usedevelop = true
commands =
  pip freeze
  pytest -vv --cov=esbuild --cov-report=html {posargs}
