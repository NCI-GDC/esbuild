[tox]
envlist = py{35,36}
requires =
    pip == 19.2.2
    virtualenv >= 20.0.21

[testenv]
changedir = tests
passenv = *
setenv =
  PG_HOST=localhost
  PG_USER=test
  PG_PASS=test
  PG_NAME=automated_test
  ES_HOST=http://localhost
  ES_PORT=9200
  ES_USE_SSL=Flase
  ES_VERIFY_CERTS=False
  CA_CERT_PATH=''
deps =
  -rrequirements.txt
  -rdev-requirements.txt
usedevelop = true
commands =
  pip freeze
  pytest -vv --cov=esbuild --cov-report=html {posargs}
