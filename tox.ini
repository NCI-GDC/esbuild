[tox]
envlist = py39

[testenv]
changedir = tests
passenv = *
setenv =
  NO_PROXY=localhost,postgres,elasticsearch
  no_proxy=localhost,postgres,elasticsearch
  PG_ESBUILD_USER=postgres
  PG_ESBUILD_PASS=test
  PG_ESBUILD_NAME=esbuild_test
  ES_ESBUILD_PORT=9200
  ES_USE_SSL=False
  ES_VERIFY_CERTS=False
  CA_CERT_PATH=''
  USE_RUNNING_ES=true
usedevelop = true
deps =
  -c requirements.txt
  .[dev]
install_command = python -m pip install {opts} {packages}
commands =
  pip freeze
  pytest -lvv --cov=esbuild --cov-report=html {posargs: -lvrf unit integration}

[testenv:publish]
changedir =
passenv =
  TWINE_*
skip_install=true
deps =
    setuptools_scm
    build
    twine
install_command =
    python -m pip install {opts} {packages}
commands =
    python -m setuptools_scm
    python -m build
    python -m twine check dist/*
    python -m twine upload dist/*
commands_post=
